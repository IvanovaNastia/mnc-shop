<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="img/logo.svg">

    <!-- для старих браузерів -->
    <link rel="shortcut icon" type="image/x-icon" href="img/logo.svg">

    <!-- для смартфонів Apple (iPhone, iPad) -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/logo.svg">

    <title>МНЦ Адмінка - товари</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="display: none;">
    <main id="body-grow">
        <div class="container">
            <div class="admin-title-block">
                <h1>Панель адміністратора магазину МНЦ</h1>
                <div class="admin-tabs">
                    <a href="admin.html" class="tab-btn active-tab">Товари</a>
                    <a href="admin-orders.html" class="tab-btn">Замовлення</a>
                </div>
                <button class="btn-add-product" id="openAddModalBtn">＋ Додати новий товар</button>
                <button class="btn-log-out" onclick="logout()">Вийти з кабінету</button>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Фото</th>
                            <th>Назва</th>
                            <th>Ціна</th>
                            <th>Знижка</th>
                            <th>Ціна зі знажкой</th>
                            <th>Нове</th>
                            <th>Популярне</th>
                            <th>Категорії</th>
                            <th>Опис</th>
                            <th>Характеристика</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Модальне вікно для додавання товару -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2 id="modalTitle">Додати новий товар</h2>
            <form id="addProductForm">
                <input type="hidden" id="form-product-id" value="">
                <div class="form-grid">

                    <!-- ЛЕВАЯ КОЛОНКА: Основное -->
                    <div class="form-column">
                        <div class="form-group">
                            <label>Назва товару:</label>
                            <input type="text" id="form-title" required>
                        </div>
                        <div class="form-group">
                            <label>Ціна (грн):</label>
                            <input type="number" id="form-price" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Знижка (%):</label>
                            <input type="number" id="form-discount" min="0" max="100" value="0">
                        </div>
                        <div class="form-group">
                            <label>Фото товару:</label>
                            <input type="hidden" id="form-product-id" value="">
                            <!-- Скрытое поле оставим на случай, если при редактировании картинка не меняется -->
                            <input type="hidden" id="form-img-old-path" value="">
                            <!-- Принимаем только изображения -->
                            <input type="file" id="form-img-file" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label>Опис:</label>
                            <textarea id="form-description" rows="4"></textarea>
                        </div>
                    </div>

                    <!-- ПРАВАЯ КОЛОНКА: Категории, Особисте, Характеристики -->
                    <div class="form-column">
                        <!-- Блок выбора категорий -->
                        <!-- Блок выбора категорий -->
                        <div class="form-group">
                            <label>Категорії:</label>
                            <div class="categories-checkbox-group">
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Побутова хімія" id="cat-household"> Побутова хімія</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Текстиль" id="cat-textile"> Текстиль</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Кухонні дрібниці" id="cat-kitchen"> Кухонні дрібниці</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Посуд" id="cat-tableware"> Посуд</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Іграшка" id="cat-toys"> Іграшка</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Канцелярія" id="cat-stationery"> Канцелярія</strong></label>
                                <label class="category-row-item"><strong><input type="checkbox" name="categories"
                                            value="Господарчі товари" id="cat-goods"> Господарчі товари</strong></label>
                            </div>

                            <!-- Подкатегории: Побутова хімія -->
                            <div id="sub-household-container" class="subcategories-block">
                                <label class="subcategories-title"><strong>Підкатегорії (Побутова
                                        хімія):</strong></label>
                                <div class="subcategories-area">
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для прання"> Для прання</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для миття посуду"> Для миття посуду</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для кухні"> Для кухні</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для ванної кімнати"> Для ванної кімнати</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для туалету"> Для туалету</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Універсальні засоби"> Універсальні засоби</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для скла та дзеркал"> Для скла та дзеркал</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для підлоги"> Для підлоги</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для меблів"> Для меблів</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для килимів та м'яких меблів"> Для килимів та м'яких меблів</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для видалення накипу"> Для видалення накипу</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Для прочищення труб"> Для прочищення труб</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Освіжувачі повітря"> Освіжувачі повітря</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Господарське мило"> Господарське мило</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Поліролі"> Поліролі</label>
                                </div>
                            </div>

                            <!-- Подкатегории: Текстиль -->
                            <div id="sub-textile-container" class="subcategories-block">
                                <label class="subcategories-title"><strong>Підкатегорії (Текстиль):</strong></label>
                                <div class="subcategories-area">
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Постільна білизна"> Постільна білизна</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Пледи та покривало"> Пледи та покривало</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Рушники кухонні"> Рушники кухонні</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Подушки та ковдри"> Подушки та ковдри</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Шкарпети жіночі"> Шкарпети жіночі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Шкарпетки чоловічі"> Шкарпетки чоловічі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Шкарпетки дитячі"> Шкарпетки дитячі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Труси жіночі"> Труси жіночі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Труси чоловічі"> Труси чоловічі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Труси дитячі"> Труси дитячі</label>
                                </div>
                            </div>

                                <label class="subcategories-title"><strong>Підкатегорії (Кухонні

                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Обробні дошки"> Обробні дошки</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Кухонне приладдя"> Кухонне приладдя</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Тертки, сита та друшляки"> Тертки, сита та друшляки</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Форми для випічки"> Форми для випічки</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Мірний посуд"> Мірний посуд</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Банки для зберігання"> Банки для зберігання</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Сушарки для посуду"> Сушарки для посуду</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                </div>
                            </div>

                            <!-- Подкатегории: Посуд -->
                            <div id="sub-tableware-container" class="subcategories-block">
                                <label class="subcategories-title"><strong>Підкатегорії (Посуд):</strong></label>
                                <div class="subcategories-area">
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Тарілки та блюда"> Тарілки та блюда</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Миски та салатники"> Миски та салатники</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Чашки, кухлі та склянки"> Чашки, кухлі та склянки</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Чайники та заварники"> Чайники та заварники</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Контейнери для їжі"> Контейнери для їжі</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Банки для зберігання"> Банки для зберігання</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Скляний посуд"> Скляний посуд</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Керамічний посуд"> Керамічний посуд</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Дитячий посуд"> Дитячий посуд</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Набори посуду"> Набори посуду</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Сервірування"> Сервірування</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Інший посуд"> Інший посуд</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Пательні"> Пательні</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Каструлі"> Каструлі</label>
                                </div>
                            </div>

                            <!-- Подкатегории: Канцелярія -->
                            <div id="sub-stationery-container" class="subcategories-block">
                                <label class="subcategories-title"><strong>Підкатегорії (Канцелярія):</strong></label>
                                <div class="subcategories-area">
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Письмове приладдя"> Письмове приладдя</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Зошити та блокноти"> Зошити та блокноти</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Альбоми та папір"> Альбоми та папір</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Творчість"> Творчість</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Пенали"> Пенали</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Папки та файли"> Папки та файли</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Обкладинки"> Обкладинки</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Настільне приладдя"> Настільне приладдя</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Офісна канцелярія"> Офісна канцелярія</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Товари для школи"> Товари для школи</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"

                                <label class="subcategories-title"><strong>Підкатегорії (Господарчі
                                        товари):</strong></label>
                                <div class="subcategories-area">
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Прибирання"> Прибирання</label>
                                    <label class="category-row-item"><input type="checkbox" name="categories"
                                            value="Відра та тази"> Відра та тази</label>

                        <!-- Блок "Особисте" -->

                            Особисте</h3>
                        <div class="form-group form-group-special">
                            <label class="category-row-item"><input type="checkbox" id="form-isNew"> Новинка</label>
                            <label class="category-row-item"><input type="checkbox" id="form-isPopular">

    <script src="js/admin.js"></script>
</body>

</html>
